<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ebook Reader</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;

            background: #222;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            height: 60px;

            background: #111;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 15px;

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 1000;
        }


        .left {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;
        }


        .back {

            text-decoration: none;

            color: white;

            background: #292929;

            padding: 9px 13px;

            border-radius: 6px;

            font-size: 14px;
        }


        .title {

            font-size: 15px;

            font-weight: 600;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            max-width: 400px;
        }


        .controls {

            display: flex;

            gap: 5px;
        }


        button {

            border: 1px solid #444;

            background: #292929;

            color: white;

            border-radius: 6px;

            cursor: pointer;
        }


        .control {

            width: 38px;

            height: 35px;

            font-size: 16px;
        }


        button:hover {

            background: #3d3d3d;
        }


        /* =========================
           PDF AREA
        ========================= */

        #pdfContainer {

            position: fixed;

            top: 60px;

            bottom: 55px;

            left: 0;

            right: 0;

            overflow-y: auto;

            overflow-x: hidden;

            background: #525659;

            padding: 20px;

            text-align: center;

            user-select: none;

            -webkit-user-select: none;
        }


        .page {

            display: block;

            margin: 0 auto 20px auto;

            background: white;

            box-shadow:
                0 2px 10px
                rgba(0, 0, 0, .35);

            max-width: 100%;

            user-select: none;

            -webkit-user-select: none;

            -webkit-user-drag: none;
        }


        /* =========================
           WATERMARK NOTICE
        ========================= */

        .protection-notice {

            position: fixed;

            bottom: 65px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 900;

            background: rgba(0, 0, 0, .75);

            color: rgba(255, 255, 255, .95);

            padding: 7px 18px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            pointer-events: none;

            user-select: none;

            white-space: nowrap;
        }


        /* =========================
           BOTTOM BAR
        ========================= */

        .bottom {

            position: fixed;

            bottom: 0;

            left: 0;

            right: 0;

            height: 55px;

            background: #111;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            z-index: 1000;
        }


        .nav {

            padding: 8px 15px;

            font-size: 13px;
        }


        #pageInfo {

            min-width: 100px;

            text-align: center;

            font-size: 13px;

            color: #ccc;
        }


        /* =========================
           LOADING
        ========================= */

        #loading {

            position: fixed;

            inset: 0;

            background: #111;

            color: white;

            z-index: 5000;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }


        #loading.hidden {

            display: none;
        }


        .spinner {

            width: 42px;

            height: 42px;

            border: 4px solid #444;

            border-top-color: white;

            border-radius: 50%;

            animation: spin .7s linear infinite;

            margin-bottom: 15px;
        }


        @keyframes spin {

            to {

                transform: rotate(360deg);
            }
        }


        /* =========================
           ERROR
        ========================= */

        #error {

            position: fixed;

            inset: 0;

            background: #111;

            color: white;

            z-index: 6000;

            display: none;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 30px;
        }


        .error-box {

            max-width: 450px;
        }


        .error-box h1 {

            font-family: Georgia, serif;
        }


        .error-box p {

            color: #aaa;

            line-height: 1.6;
        }


        .error-box a {

            display: inline-block;

            margin-top: 15px;

            padding: 10px 18px;

            background: white;

            color: #111;

            text-decoration: none;

            border-radius: 6px;
        }


        /* =========================
           PROTECTED SCREEN
        ========================= */

        #protectedScreen {

            position: fixed;

            inset: 0;

            background: #111;

            color: white;

            z-index: 7000;

            display: none;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 30px;
        }


        #protectedScreen .protected-box {

            max-width: 450px;
        }


        #protectedScreen h1 {

            font-size: 28px;

            margin-bottom: 10px;
        }


        #protectedScreen p {

            color: #aaa;

            line-height: 1.6;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .header {

                height: 55px;

                padding: 0 8px;
            }


            #pdfContainer {

                top: 55px;

                padding: 10px;
            }


            .title {

                max-width: 120px;

                font-size: 13px;
            }


            .back {

                padding: 8px 9px;

                font-size: 12px;
            }


            .control {

                width: 32px;

                height: 32px;

                font-size: 13px;
            }


            .protection-notice {

                bottom: 60px;

                font-size: 10px;

                padding: 6px 12px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">


        <div class="left">


            <a
                href="library.html"
                class="back"
            >
                ← Library
            </a>


            <div
                id="bookTitle"
                class="title"
            >
                Loading...
            </div>


        </div>


        <div class="controls">


            <button
                id="zoomOut"
                class="control"
                title="Zoom out"
            >
                −
            </button>


            <button
                id="zoomIn"
                class="control"
                title="Zoom in"
            >
                +
            </button>


            <button
                id="darkMode"
                class="control"
                title="Dark mode"
            >
                ☾
            </button>


            <button
                id="fullscreen"
                class="control"
                title="Fullscreen"
            >
                ⛶
            </button>


        </div>


    </header>


    <!-- =========================
         PDF
    ========================= -->

    <main id="pdfContainer"></main>


    <!-- =========================
         WATERMARK NOTICE
    ========================= -->

    <div class="protection-notice">

        🔒 PROTECTED • © MoneshSys

    </div>


    <!-- =========================
         BOTTOM
    ========================= -->

    <div class="bottom">


        <button
            id="previous"
            class="nav"
        >
            ← Previous
        </button>


        <div id="pageInfo">

            Loading...

        </div>


        <button
            id="next"
            class="nav"
        >
            Next →

        </button>


    </div>


    <!-- =========================
         LOADING
    ========================= -->

    <div id="loading">


        <div class="spinner"></div>


        <div>
            Opening ebook...
        </div>


    </div>


    <!-- =========================
         ERROR
    ========================= -->

    <div id="error">


        <div class="error-box">


            <h1>
                Unable to open ebook
            </h1>


            <p id="errorMessage">

                Something went wrong.

            </p>


            <a href="library.html">

                Back to Library

            </a>


        </div>


    </div>


    <!-- =========================
         PROTECTED SCREEN
    ========================= -->

    <div id="protectedScreen">


        <div class="protected-box">


            <h1>
                🔒 Protected Reader
            </h1>


            <p>

                The ebook is temporarily hidden
                because the reader window is not active.

            </p>


            <p>

                Return to this reader to continue reading.

            </p>


        </div>


    </div>



    <!-- =========================
         BOOK DATA
    ========================= -->

    <script src="js/data.js"></script>



    <!-- =========================
         PDF.JS
    ========================= -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
    ></script>



    <script>


        // =====================================================
        // PDF.JS WORKER
        // =====================================================

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



        // =====================================================
        // GET BOOK ID
        // =====================================================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const bookId =
            Number(
                params.get("id")
            );



        // =====================================================
        // FIND BOOK
        // =====================================================

        const book =
            books.find(
                item =>
                    Number(item.id) === bookId
            );



        // =====================================================
        // ELEMENTS
        // =====================================================

        const container =
            document.getElementById(
                "pdfContainer"
            );


        const bookTitle =
            document.getElementById(
                "bookTitle"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        const error =
            document.getElementById(
                "error"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        const pageInfo =
            document.getElementById(
                "pageInfo"
            );


        const previous =
            document.getElementById(
                "previous"
            );


        const next =
            document.getElementById(
                "next"
            );


        const zoomIn =
            document.getElementById(
                "zoomIn"
            );


        const zoomOut =
            document.getElementById(
                "zoomOut"
            );


        const darkMode =
            document.getElementById(
                "darkMode"
            );


        const fullscreen =
            document.getElementById(
                "fullscreen"
            );


        const protectedScreen =
            document.getElementById(
                "protectedScreen"
            );



        // =====================================================
        // VARIABLES
        // =====================================================

        let pdf = null;

        let currentPage = 1;

        let totalPages = 0;

        let scale = 1.3;

        let dark = false;



        // =====================================================
        // CHECK BOOK
        // =====================================================

        if (!book) {

            showError(
                "Book not found."
            );

        }

        else {

            bookTitle.textContent =
                book.title;

            openPDF();

        }



        // =====================================================
        // OPEN PDF
        // =====================================================

        async function openPDF() {

            try {


                pdf =
                    await pdfjsLib.getDocument(
                        book.pdf
                    ).promise;


                totalPages =
                    pdf.numPages;


                loading.classList.add(
                    "hidden"
                );


                // Render first page

                await renderPage(
                    1
                );


                pageInfo.textContent =
                    "1 / " +
                    totalPages;



                // Restore previous page

                const savedPage =
                    Number(
                        localStorage.getItem(
                            "pdf-page-" +
                            book.id
                        )
                    );


                if (

                    savedPage &&

                    savedPage >= 1 &&

                    savedPage <= totalPages

                ) {

                    currentPage =
                        savedPage;


                    await renderPage(
                        currentPage
                    );

                }


            }

            catch (err) {

                console.error(err);


                showError(
                    "Could not open the PDF. Check that the PDF exists in your books folder."
                );

            }

        }



        // =====================================================
        // STRONG CANVAS WATERMARK
        // =====================================================

        function addWatermark(
            ctx,
            canvas
        ) {


            const width =
                canvas.width;


            const height =
                canvas.height;



            // Save current canvas state

            ctx.save();



            // ================================================
            // DIAGONAL WATERMARK
            // ================================================

            ctx.globalAlpha =
                0.18;


            ctx.fillStyle =
                "#000000";


            const fontSize =
                Math.max(
                    20,
                    width / 32
                );


            ctx.font =
                "bold " +
                fontSize +
                "px Arial";


            ctx.textAlign =
                "center";


            ctx.textBaseline =
                "middle";



            // Move to center

            ctx.translate(
                width / 2,
                height / 2
            );


            // Rotate watermark

            ctx.rotate(
                -30 *
                Math.PI /
                180
            );



            const spacingX =
                Math.max(
                    350,
                    width * 0.55
                );


            const spacingY =
                Math.max(
                    130,
                    height * 0.18
                );



            // Repeat watermark

            for (

                let y =
                    -height;

                y <
                    height;

                y +=
                    spacingY

            ) {


                for (

                    let x =
                        -width;

                    x <
                        width;

                    x +=
                        spacingX

                ) {


                    ctx.fillText(

                        "© MoneshSys • PROTECTED EBOOK",

                        x,

                        y

                    );

                }

            }



            ctx.restore();



            // ================================================
            // CENTER WATERMARK
            // ================================================

            ctx.save();


            ctx.globalAlpha =
                0.24;


            ctx.fillStyle =
                "#000000";


            ctx.font =
                "bold " +
                Math.max(
                    18,
                    width / 38
                ) +
                "px Arial";


            ctx.textAlign =
                "center";


            ctx.textBaseline =
                "middle";


            ctx.fillText(

                "🔒 MONESHSYS • PROTECTED",

                width / 2,

                height / 2

            );


            ctx.restore();



            // ================================================
            // BOTTOM WATERMARK
            // ================================================

            ctx.save();


            ctx.globalAlpha =
                0.28;


            ctx.fillStyle =
                "#000000";


            ctx.font =
                "bold " +
                Math.max(
                    14,
                    width / 50
                ) +
                "px Arial";


            ctx.textAlign =
                "center";


            ctx.fillText(

                "© MoneshSys • Unauthorized copying prohibited",

                width / 2,

                height - 30

            );


            ctx.restore();

        }



        // =====================================================
        // RENDER PAGE
        // =====================================================

        async function renderPage(
            pageNumber
        ) {


            const page =
                await pdf.getPage(
                    pageNumber
                );


            const viewport =
                page.getViewport({
                    scale: scale
                });



            const canvas =
                document.createElement(
                    "canvas"
                );


            const context =
                canvas.getContext(
                    "2d"
                );


            canvas.className =
                "page";



            canvas.width =
                viewport.width;


            canvas.height =
                viewport.height;



            // Prevent dragging

            canvas.draggable =
                false;



            // Clear old page

            container.innerHTML =
                "";


            container.appendChild(
                canvas
            );



            // =================================================
            // RENDER ORIGINAL PDF
            // =================================================

            await page.render({

                canvasContext:
                    context,

                viewport:
                    viewport

            }).promise;



            // =================================================
            // APPLY WATERMARK DIRECTLY TO CANVAS
            // =================================================

            addWatermark(
                context,
                canvas
            );



            // Update page

            currentPage =
                pageNumber;


            pageInfo.textContent =

                currentPage +
                " / " +
                totalPages;



            // Save reading position

            localStorage.setItem(

                "pdf-page-" +
                book.id,

                currentPage

            );



            // Update buttons

            previous.disabled =

                currentPage <= 1;


            next.disabled =

                currentPage >= totalPages;

        }



        // =====================================================
        // NEXT
        // =====================================================

        next.addEventListener(

            "click",

            function() {


                if (

                    currentPage <
                    totalPages

                ) {


                    renderPage(

                        currentPage +
                        1

                    );

                }

            }

        );



        // =====================================================
        // PREVIOUS
        // =====================================================

        previous.addEventListener(

            "click",

            function() {


                if (

                    currentPage >
                    1

                ) {


                    renderPage(

                        currentPage -
                        1

                    );

                }

            }

        );



        // =====================================================
        // ZOOM IN
        // =====================================================

        zoomIn.addEventListener(

            "click",

            function() {


                if (

                    scale <
                    2.5

                ) {


                    scale +=
                        0.2;


                    renderPage(
                        currentPage
                    );

                }

            }

        );



        // =====================================================
        // ZOOM OUT
        // =====================================================

        zoomOut.addEventListener(

            "click",

            function() {


                if (

                    scale >
                    0.7

                ) {


                    scale -=
                        0.2;


                    renderPage(
                        currentPage
                    );

                }

            }

        );



        // =====================================================
        // DARK MODE
        // =====================================================

        darkMode.addEventListener(

            "click",

            function() {


                dark =
                    !dark;


                if (dark) {


                    document.body.style.background =
                        "#181818";


                    container.style.background =
                        "#181818";


                    darkMode.textContent =
                        "☀";

                }

                else {


                    document.body.style.background =
                        "#222";


                    container.style.background =
                        "#525659";


                    darkMode.textContent =
                        "☾";

                }

            }

        );



        // =====================================================
        // FULLSCREEN
        // =====================================================

        fullscreen.addEventListener(

            "click",

            async function() {


                try {


                    if (

                        !document.fullscreenElement

                    ) {


                        await document
                            .documentElement
                            .requestFullscreen();

                    }

                    else {


                        await document
                            .exitFullscreen();

                    }


                }

                catch (err) {

                    console.log(err);

                }

            }

        );



        // =====================================================
        // KEYBOARD NAVIGATION
        // =====================================================

        document.addEventListener(

            "keydown",

            function(event) {


                // Next page

                if (

                    event.key ===
                    "ArrowRight"

                ) {


                    if (

                        currentPage <
                        totalPages

                    ) {


                        renderPage(

                            currentPage +
                            1

                        );

                    }

                }



                // Previous page

                if (

                    event.key ===
                    "ArrowLeft"

                ) {


                    if (

                        currentPage >
                        1

                    ) {


                        renderPage(

                            currentPage -
                            1

                        );

                    }

                }

            }

        );



        // =====================================================
        // ERROR
        // =====================================================

        function showError(
            message
        ) {


            loading.classList.add(
                "hidden"
            );


            errorMessage.textContent =
                message;


            error.style.display =
                "flex";

        }



        // =====================================================
        // BASIC UI PROTECTION
        // =====================================================

        // Disable right click

        document.addEventListener(

            "contextmenu",

            function(event) {

                event.preventDefault();

            }

        );



        // Disable copy

        document.addEventListener(

            "copy",

            function(event) {

                event.preventDefault();

            }

        );



        // Disable cut

        document.addEventListener(

            "cut",

            function(event) {

                event.preventDefault();

            }

        );



        // Disable text selection

        document.addEventListener(

            "selectstart",

            function(event) {

                event.preventDefault();

            }

        );



        // Disable drag

        document.addEventListener(

            "dragstart",

            function(event) {

                event.preventDefault();

            }

        );



        // =====================================================
        // BLOCK COMMON SHORTCUTS
        // =====================================================

        document.addEventListener(

            "keydown",

            function(event) {


                const key =
                    event.key.toLowerCase();



                // Ctrl / CMD shortcuts

                if (

                    event.ctrlKey ||
                    event.metaKey

                ) {


                    if (

                        key === "s" ||

                        key === "p" ||

                        key === "c" ||

                        key === "x" ||

                        key === "u" ||

                        key === "a"

                    ) {


                        event.preventDefault();

                    }

                }



                // Developer tools

                if (

                    event.key ===
                    "F12"

                ) {


                    event.preventDefault();

                }



                if (

                    (event.ctrlKey ||
                     event.metaKey) &&

                    event.shiftKey &&

                    (

                        key === "i" ||

                        key === "j" ||

                        key === "c"

                    )

                ) {


                    event.preventDefault();

                }

            }

        );



        // =====================================================
        // HIDE READER WHEN WINDOW LOSES FOCUS
        // =====================================================

        let readerHidden =
            false;



        function hideReader() {


            if (readerHidden)
                return;


            readerHidden =
                true;


            container.style.visibility =
                "hidden";


            protectedScreen.style.display =
                "flex";

        }



        function showReader() {


            if (!readerHidden)
                return;


            readerHidden =
                false;


            protectedScreen.style.display =
                "none";


            container.style.visibility =
                "visible";

        }



        // When tab becomes hidden

        document.addEventListener(

            "visibilitychange",

            function() {


                if (

                    document.hidden

                ) {

                    hideReader();

                }

                else {

                    showReader();

                }

            }

        );



        // When browser window loses focus

        window.addEventListener(

            "blur",

            function() {

                hideReader();

            }

        );



        window.addEventListener(

            "focus",

            function() {

                showReader();

            }

        );



        // =====================================================
        // PRINT PROTECTION
        // =====================================================

        window.addEventListener(

            "beforeprint",

            function() {

                hideReader();

            }

        );


        window.addEventListener(

            "afterprint",

            function() {

                showReader();

            }

        );



        // =====================================================
        // PREVENT CANVAS DRAGGING
        // =====================================================

        document.addEventListener(

            "mousedown",

            function(event) {


                if (

                    event.target.tagName ===
                    "CANVAS"

                ) {

                    event.preventDefault();

                }

            }

        );



    </script>


</body>

</html>
