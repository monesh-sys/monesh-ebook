<script

></script>



<script>


// =====================================================
// PDF.JS WORKER
// =====================================================

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



// =====================================================
// GET BOOK ID
// =====================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const bookId =
    Number(
        params.get("id")
    );



// =====================================================
// FIND BOOK
// =====================================================

const book =
    books.find(
        item =>
            Number(item.id) === bookId
    );



// =====================================================
// ELEMENTS
// =====================================================

const container =
    document.getElementById(
        "pdfContainer"
    );


const bookTitle =
    document.getElementById(
        "bookTitle"
    );


const loading =
    document.getElementById(
        "loading"
    );


const error =
    document.getElementById(
        "error"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const pageInfo =
    document.getElementById(
        "pageInfo"
    );


const previous =
    document.getElementById(
        "previous"
    );


const next =
    document.getElementById(
        "next"
    );


const zoomIn =
    document.getElementById(
        "zoomIn"
    );


const zoomOut =
    document.getElementById(
        "zoomOut"
    );


const darkMode =
    document.getElementById(
        "darkMode"
    );


const fullscreen =
    document.getElementById(
        "fullscreen"
    );


const securityScreen =
    document.getElementById(
        "securityScreen"
    );



// =====================================================
// VARIABLES
// =====================================================

let pdf = null;

let currentPage = 1;

let totalPages = 0;

let scale = 1.3;

let dark = false;



// =====================================================
// CHECK BOOK
// =====================================================

if (!book) {

    showError(
        "Book not found."
    );

} else {

    bookTitle.textContent =
        book.title;

    openPDF();

}



// =====================================================
// OPEN PDF
// =====================================================

async function openPDF() {

    try {

        /*
         * PDF is loaded from data.js.
         */

        pdf =
            await pdfjsLib.getDocument(
                book.pdf
            ).promise;


        totalPages =
            pdf.numPages;


        loading.classList.add(
            "hidden"
        );


        /*
         * Render first page.
         */

        await renderPage(
            1
        );


        pageInfo.textContent =
            "1 / " + totalPages;


        /*
         * Restore previous page.
         */

        const savedPage =
            Number(
                localStorage.getItem(
                    "pdf-page-" +
                    book.id
                )
            );


        if (
            savedPage &&
            savedPage >= 1 &&
            savedPage <= totalPages
        ) {

            currentPage =
                savedPage;

            await renderPage(
                currentPage
            );

        }


    } catch (err) {

        console.error(err);

        showError(
            "Could not open the PDF. Check that the PDF exists in your books folder."
        );

    }

}



// =====================================================
// RENDER PAGE
// =====================================================

async function renderPage(
    pageNumber
) {

    try {

        const page =
            await pdf.getPage(
                pageNumber
            );


        const viewport =
            page.getViewport({
                scale: scale
            });


        const canvas =
            document.createElement(
                "canvas"
            );


        const context =
            canvas.getContext(
                "2d"
            );


        canvas.className =
            "page";


        canvas.width =
            viewport.width;


        canvas.height =
            viewport.height;


        /*
         * Security attributes.
         */

        canvas.setAttribute(
            "draggable",
            "false"
        );


        canvas.addEventListener(
            "contextmenu",
            function(event) {

                event.preventDefault();

            }
        );


        canvas.addEventListener(
            "dragstart",
            function(event) {

                event.preventDefault();

            }
        );


        /*
         * Clear old page.
         */

        container.innerHTML =
            "";


        container.appendChild(
            canvas
        );


        /*
         * Render current page.
         */

        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;


        currentPage =
            pageNumber;


        pageInfo.textContent =
            currentPage +
            " / " +
            totalPages;


        /*
         * Save reading position.
         */

        localStorage.setItem(

            "pdf-page-" +
            book.id,

            currentPage

        );


        /*
         * Update buttons.
         */

        previous.disabled =
            currentPage <= 1;


        next.disabled =
            currentPage >= totalPages;

    }

    catch (err) {

        console.error(err);

    }

}



// =====================================================
// NEXT
// =====================================================

next.addEventListener(
    "click",
    function() {

        if (
            currentPage <
            totalPages
        ) {

            renderPage(
                currentPage + 1
            );

        }

    }
);



// =====================================================
// PREVIOUS
// =====================================================

previous.addEventListener(
    "click",
    function() {

        if (
            currentPage > 1
        ) {

            renderPage(
                currentPage - 1
            );

        }

    }
);



// =====================================================
// ZOOM IN
// =====================================================

zoomIn.addEventListener(
    "click",
    function() {

        if (
            scale < 2.5
        ) {

            scale += .2;

            renderPage(
                currentPage
            );

        }

    }
);



// =====================================================
// ZOOM OUT
// =====================================================

zoomOut.addEventListener(
    "click",
    function() {

        if (
            scale > .7
        ) {

            scale -= .2;

            renderPage(
                currentPage
            );

        }

    }
);



// =====================================================
// DARK MODE
// =====================================================

darkMode.addEventListener(
    "click",
    function() {

        dark =
            !dark;


        if (dark) {

            document.body.style.background =
                "#181818";

            container.style.background =
                "#181818";

            darkMode.textContent =
                "☀";

        }

        else {

            document.body.style.background =
                "#222";

            container.style.background =
                "#525659";

            darkMode.textContent =
                "☾";

        }

    }
);



// =====================================================
// FULLSCREEN
// =====================================================

fullscreen.addEventListener(
    "click",
    async function() {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            }

            else {

                await document.exitFullscreen();

            }

        }

        catch (err) {

            console.log(err);

        }

    }
);



// =====================================================
// KEYBOARD NAVIGATION
// =====================================================

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowRight"
        ) {

            if (
                currentPage <
                totalPages
            ) {

                renderPage(
                    currentPage + 1
                );

            }

        }


        if (
            event.key === "ArrowLeft"
        ) {

            if (
                currentPage > 1
            ) {

                renderPage(
                    currentPage - 1
                );

            }

        }

    }
);



// =====================================================
// ERROR
// =====================================================

function showError(message) {

    loading.classList.add(
        "hidden"
    );


    errorMessage.textContent =
        message;


    error.style.display =
        "flex";

}



// =====================================================
// SECURITY
// =====================================================


// -----------------------------------------------------
// BLOCK RIGHT CLICK
// -----------------------------------------------------

document.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);



// -----------------------------------------------------
// BLOCK TEXT SELECTION
// -----------------------------------------------------

document.addEventListener(
    "selectstart",
    function(event) {

        event.preventDefault();

    }
);



// -----------------------------------------------------
// BLOCK COPY
// -----------------------------------------------------

document.addEventListener(
    "copy",
    function(event) {

        event.preventDefault();

    }
);



// -----------------------------------------------------
// BLOCK CUT
// -----------------------------------------------------

document.addEventListener(
    "cut",
    function(event) {

        event.preventDefault();

    }
);



// -----------------------------------------------------
// BLOCK DRAG
// -----------------------------------------------------

document.addEventListener(
    "dragstart",
    function(event) {

        event.preventDefault();

    }
);



// -----------------------------------------------------
// KEYBOARD PROTECTION
// -----------------------------------------------------

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();


        const ctrl =
            event.ctrlKey ||
            event.metaKey;


        /*
         * Block:
         *
         * Ctrl + S
         * Ctrl + P
         * Ctrl + C
         * Ctrl + X
         * Ctrl + U
         * Ctrl + A
         */

        if (
            ctrl &&
            (
                key === "s" ||
                key === "p" ||
                key === "c" ||
                key === "x" ||
                key === "u" ||
                key === "a"
            )
        ) {

            event.preventDefault();

            return;

        }


        /*
         * Block F12
         */

        if (
            event.key === "F12"
        ) {

            event.preventDefault();

            return;

        }


        /*
         * Block Ctrl + Shift + I
         */

        if (
            ctrl &&
            event.shiftKey &&
            key === "i"
        ) {

            event.preventDefault();

            return;

        }


        /*
         * Block Ctrl + Shift + J
         */

        if (
            ctrl &&
            event.shiftKey &&
            key === "j"
        ) {

            event.preventDefault();

            return;

        }


        /*
         * Block Ctrl + Shift + C
         */

        if (
            ctrl &&
            event.shiftKey &&
            key === "c"
        ) {

            event.preventDefault();

            return;

        }

    }
);



// =====================================================
// TAB / WINDOW VISIBILITY PROTECTION
// =====================================================

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.hidden
        ) {

            /*
             * Hide ebook when user
             * switches tabs/windows.
             */

            container.style.visibility =
                "hidden";


            securityScreen.style.display =
                "flex";

        }

        else {

            /*
             * Show ebook again.
             */

            securityScreen.style.display =
                "none";


            container.style.visibility =
                "visible";

        }

    }
);



// =====================================================
// WINDOW BLUR PROTECTION
// =====================================================

window.addEventListener(
    "blur",
    function() {

        container.style.visibility =
            "hidden";


        securityScreen.style.display =
            "flex";

    }
);


window.addEventListener(
    "focus",
    function() {

        securityScreen.style.display =
            "none";


        container.style.visibility =
            "visible";

    }
);



// =====================================================
// PRINT PROTECTION
// =====================================================

window.addEventListener(
    "beforeprint",
    function() {

        container.style.display =
            "none";

        securityScreen.style.display =
            "flex";

    }
);


window.addEventListener(
    "afterprint",
    function() {

        container.style.display =
            "block";

        securityScreen.style.display =
            "none";

    }
);



// =====================================================
// EXTRA CANVAS PROTECTION
// =====================================================

document.addEventListener(
    "mousedown",
    function(event) {

        if (
            event.button === 2
        ) {

            event.preventDefault();

        }

    }
);



// =====================================================
// DISABLE IMAGE / CANVAS DRAGGING
// =====================================================

document.addEventListener(
    "drag",
    function(event) {

        event.preventDefault();

    }
);



// =====================================================
// BEFORE UNLOAD
// =====================================================

window.addEventListener(
    "beforeunload",
    function() {

        /*
         * Reading position is already
         * saved whenever the page changes.
         */

    }
);


</script>

</body>

</html>
