<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ebook Reader</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, sans-serif;

            background: #222;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            height: 60px;

            background: #111;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 15px;

            position: fixed;

            top: 0;

            left: 0;

            right: 0;

            z-index: 1000;
        }


        .left {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;
        }


        .back {

            text-decoration: none;

            color: white;

            background: #292929;

            padding: 9px 13px;

            border-radius: 6px;

            font-size: 14px;
        }


        .title {

            font-size: 15px;

            font-weight: 600;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            max-width: 400px;
        }


        .controls {

            display: flex;

            gap: 5px;
        }


        button {

            border: 1px solid #444;

            background: #292929;

            color: white;

            border-radius: 6px;

            cursor: pointer;
        }


        .control {

            width: 38px;

            height: 35px;

            font-size: 16px;
        }


        button:hover {

            background: #3d3d3d;
        }


        /* =========================
           PDF AREA
        ========================= */

        #pdfContainer {

            position: fixed;

            top: 60px;

            bottom: 55px;

            left: 0;

            right: 0;

            overflow-y: auto;

            overflow-x: hidden;

            background: #525659;

            padding: 20px;

            text-align: center;
        }


        .page {

            display: block;

            margin: 0 auto 20px auto;

            background: white;

            box-shadow:
                0 2px 10px
                rgba(0, 0, 0, .35);

            max-width: 100%;
        }


        /* =========================
           BOTTOM BAR
        ========================= */

        .bottom {

            position: fixed;

            bottom: 0;

            left: 0;

            right: 0;

            height: 55px;

            background: #111;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            z-index: 1000;
        }


        .nav {

            padding: 8px 15px;

            font-size: 13px;
        }


        #pageInfo {

            min-width: 100px;

            text-align: center;

            font-size: 13px;

            color: #ccc;
        }


        /* =========================
           LOADING
        ========================= */

        #loading {

            position: fixed;

            inset: 0;

            background: #111;

            color: white;

            z-index: 5000;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }


        #loading.hidden {

            display: none;
        }


        .spinner {

            width: 42px;

            height: 42px;

            border: 4px solid #444;

            border-top-color: white;

            border-radius: 50%;

            animation: spin .7s linear infinite;

            margin-bottom: 15px;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================
           ERROR
        ========================= */

        #error {

            position: fixed;

            inset: 0;

            background: #111;

            color: white;

            z-index: 6000;

            display: none;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 30px;
        }


        .error-box {

            max-width: 450px;
        }


        .error-box h1 {

            font-family: Georgia, serif;
        }


        .error-box p {

            color: #aaa;

            line-height: 1.6;
        }


        .error-box a {

            display: inline-block;

            margin-top: 15px;

            padding: 10px 18px;

            background: white;

            color: #111;

            text-decoration: none;

            border-radius: 6px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .header {

                height: 55px;

                padding: 0 8px;
            }


            #pdfContainer {

                top: 55px;
            }


            .title {

                max-width: 120px;

                font-size: 13px;
            }


            .back {

                padding: 8px 9px;

                font-size: 12px;
            }


            .control {

                width: 32px;

                height: 32px;

                font-size: 13px;
            }


            #pdfContainer {

                padding: 10px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">


    <div class="left">

        <a
            href="library.html"
            class="back"
        >
            ← Library
        </a>


        <div
            id="bookTitle"
            class="title"
        >
            Loading...
        </div>

    </div>


    <div class="controls">

        <button
            id="zoomOut"
            class="control"
            title="Zoom out"
        >
            −
        </button>


        <button
            id="zoomIn"
            class="control"
            title="Zoom in"
        >
            +
        </button>


        <button
            id="darkMode"
            class="control"
            title="Dark mode"
        >
            ☾
        </button>


        <button
            id="fullscreen"
            class="control"
            title="Fullscreen"
        >
            ⛶
        </button>

    </div>

</header>



<!-- =========================
     PDF
========================= -->

<main id="pdfContainer"></main>



<!-- =========================
     BOTTOM
========================= -->

<div class="bottom">


    <button
        id="previous"
        class="nav"
    >
        ← Previous
    </button>


    <div id="pageInfo">
        Loading...
    </div>


    <button
        id="next"
        class="nav"
    >
        Next →
    </button>

</div>



<!-- =========================
     LOADING
========================= -->

<div id="loading">

    <div class="spinner"></div>

    <div>
        Opening ebook...
    </div>

</div>



<!-- =========================
     ERROR
========================= -->

<div id="error">

    <div class="error-box">

        <h1>
            Unable to open ebook
        </h1>

        <p id="errorMessage">
            Something went wrong.
        </p>

        <a href="library.html">
            Back to Library
        </a>

    </div>

</div>



<!-- =========================
     BOOK DATA
========================= -->

<script src="js/data.js"></script>



<!-- =========================
     PDF.JS
========================= -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
></script>



<script>


// =====================================================
// PDF.JS WORKER
// =====================================================

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



// =====================================================
// GET BOOK ID
// =====================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const bookId =
    Number(
        params.get("id")
    );



// =====================================================
// FIND BOOK
// =====================================================

const book =
    books.find(
        item =>
            Number(item.id) === bookId
    );



// =====================================================
// ELEMENTS
// =====================================================

const container =
    document.getElementById(
        "pdfContainer"
    );


const bookTitle =
    document.getElementById(
        "bookTitle"
    );


const loading =
    document.getElementById(
        "loading"
    );


const error =
    document.getElementById(
        "error"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const pageInfo =
    document.getElementById(
        "pageInfo"
    );


const previous =
    document.getElementById(
        "previous"
    );


const next =
    document.getElementById(
        "next"
    );


const zoomIn =
    document.getElementById(
        "zoomIn"
    );


const zoomOut =
    document.getElementById(
        "zoomOut"
    );


const darkMode =
    document.getElementById(
        "darkMode"
    );


const fullscreen =
    document.getElementById(
        "fullscreen"
    );



// =====================================================
// VARIABLES
// =====================================================

let pdf = null;

let currentPage = 1;

let totalPages = 0;

let scale = 1.3;



// =====================================================
// CHECK BOOK
// =====================================================

if (!book) {

    showError(
        "Book not found."
    );

} else {

    bookTitle.textContent =
        book.title;

    openPDF();

}



// =====================================================
// OPEN PDF
// =====================================================

async function openPDF() {

    try {

        /*
         * IMPORTANT:
         *
         * The PDF is loaded directly from
         * the path in data.js.
         */

        pdf =
            await pdfjsLib.getDocument(
                book.pdf
            ).promise;


        totalPages =
            pdf.numPages;


        loading.classList.add(
            "hidden"
        );


        /*
         * Render first page immediately.
         */

        await renderPage(
            1
        );


        pageInfo.textContent =
            "1 / " + totalPages;


        /*
         * Restore previous page.
         */

        const savedPage =
            Number(
                localStorage.getItem(
                    "pdf-page-" +
                    book.id
                )
            );


        if (
            savedPage &&
            savedPage >= 1 &&
            savedPage <= totalPages
        ) {

            currentPage =
                savedPage;

            await renderPage(
                currentPage
            );

        }


    } catch (err) {

        console.error(err);

        showError(
            "Could not open the PDF. Check that the PDF exists in your books folder."
        );

    }

}



// =====================================================
// RENDER PAGE
// =====================================================

async function renderPage(
    pageNumber
) {

    const page =
        await pdf.getPage(
            pageNumber
        );


    const viewport =
        page.getViewport({
            scale: scale
        });


    const canvas =
        document.createElement(
            "canvas"
        );


    const context =
        canvas.getContext(
            "2d"
        );


    canvas.className =
        "page";


    canvas.width =
        viewport.width;


    canvas.height =
        viewport.height;


    /*
     * Clear old page.
     */

    container.innerHTML =
        "";


    container.appendChild(
        canvas
    );


    /*
     * Render only the current page.
     */

    await page.render({

        canvasContext:
            context,

        viewport:
            viewport

    }).promise;


    currentPage =
        pageNumber;


    pageInfo.textContent =
        currentPage +
        " / " +
        totalPages;


    /*
     * Save reading position.
     */

    localStorage.setItem(

        "pdf-page-" +
        book.id,

        currentPage

    );


    /*
     * Update buttons.
     */

    previous.disabled =
        currentPage <= 1;


    next.disabled =
        currentPage >= totalPages;

}



// =====================================================
// NEXT
// =====================================================

next.addEventListener(
    "click",
    function() {

        if (
            currentPage <
            totalPages
        ) {

            renderPage(
                currentPage + 1
            );

        }

    }
);



// =====================================================
// PREVIOUS
// =====================================================

previous.addEventListener(
    "click",
    function() {

        if (
            currentPage > 1
        ) {

            renderPage(
                currentPage - 1
            );

        }

    }
);



// =====================================================
// ZOOM IN
// =====================================================

zoomIn.addEventListener(
    "click",
    function() {

        if (
            scale < 2.5
        ) {

            scale += .2;

            renderPage(
                currentPage
            );

        }

    }
);



// =====================================================
// ZOOM OUT
// =====================================================

zoomOut.addEventListener(
    "click",
    function() {

        if (
            scale > .7
        ) {

            scale -= .2;

            renderPage(
                currentPage
            );

        }

    }
);



// =====================================================
// DARK MODE
// =====================================================

let dark =
    false;


darkMode.addEventListener(
    "click",
    function() {

        dark =
            !dark;


        if (dark) {

            document.body.style.background =
                "#181818";

            container.style.background =
                "#181818";

            darkMode.textContent =
                "☀";

        } else {

            document.body.style.background =
                "#222";

            container.style.background =
                "#525659";

            darkMode.textContent =
                "☾";

        }

    }
);



// =====================================================
// FULLSCREEN
// =====================================================

fullscreen.addEventListener(
    "click",
    async function() {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (err) {

            console.log(err);

        }

    }
);



// =====================================================
// KEYBOARD
// =====================================================

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowRight"
        ) {

            if (
                currentPage <
                totalPages
            ) {

                renderPage(
                    currentPage + 1
                );

            }

        }


        if (
            event.key === "ArrowLeft"
        ) {

            if (
                currentPage > 1
            ) {

                renderPage(
                    currentPage - 1
                );

            }

        }

    }
);



// =====================================================
// ERROR
// =====================================================

function showError(message) {

    loading.classList.add(
        "hidden"
    );


    errorMessage.textContent =
        message;


    error.style.display =
        "flex";

}



// =====================================================
// BASIC UI PROTECTION
// =====================================================

document.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.ctrlKey &&
            (
                event.key.toLowerCase() === "s" ||
                event.key.toLowerCase() === "p"
            )
        ) {

            event.preventDefault();

        }

    }
);

</script>

</body>

</html>
